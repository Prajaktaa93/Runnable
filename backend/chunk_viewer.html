    <script>
        const chunks = [{"id": "b12a9f0e-8d6c-40de-9999-3582cb1c16c8", "index": 1, "file_name": "dynamic_warmup_9.md", "category": "mobility", "topic": "Dynamic Warmup", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 2049, "text": "# How To Warm Up Before Running, According to Experts\n\nHow To Warm Up Before Running, According to Experts\nSports & Activity\nWhat you do before going for a run can have a positive impact on your performance \u2014 and your recovery.\nLast updated: September 19, 2022\n5 min read\nWhen it comes to timeless advice for runners, the main tips are classics for a reason:\nReplace your running shoes\nabout every 300 miles or six months,\nstay hydrated\n(even in cold weather), gradually\nbuild mileage\n, and remember to warm up before running.\nWhile the other strategies are relatively straightforward, the last one can inspire a number of questions. How long should your warm-up be? What type of movements should it include? And is it really necessary, especially when you're crunched for time? Like running itself, warm-ups depend on factors such as muscle tightness, level of fitness, past or current injuries, as well as the plan for the run.\n\"A good warm-up is key to a good run,\" said Amy Morris,\nRRCA-certified running coach\n,\nNASM C.P.T.\nin Chicago. \"Even 10 minutes of focused work with bodyweight movements can offer considerable benefits for getting you ready to run, such as warming up muscles and mentally preparing you. It helps with recovery as well.\"\n(Related:\nSo, What\u2019s a Calisthenics Workout, Anyway?\n)\nSimple Warm-Up Ideas\nAlthough running is seen as a lower-body burner, it\u2019s truly a full-body workout, Morris said. Not to mention, the core muscles offer stability to help keep you balanced, she added.\nBecause of that, she suggested doing a dynamic warm-up that includes mimicking the movements that you're about to do. For running, that would be an easy jog, for example, as well as movement that targets the hips, legs, glutes, and core.\nThis may include:\n10 slow leg swings back and forth on each leg\n10 squats or jump squats\nLateral moves, such as 10 curtsey squats or 10 lateral lunges\nTwo or three\ncore exercises\nwith movement, such as plank step, windshield wipers, or mountain climbers\nAnother one to try? The Nordic hamstring exercise."}, {"id": "429dd45b-b643-43c4-a883-3489f1673360", "index": 2, "file_name": "dynamic_warmup_9.md", "category": "mobility", "topic": "Dynamic Warmup", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 2004, "text": "The Nordic hamstring exercise. According to a research review in a 2019 issue of the\nBritish Journal of Sports Medicine\n, which looked at nearly 8,500 athletes and strategies for injury prevention, this particular exercise cut hamstring injury incidence in half.\nLead researcher of that study, Ireland-based physiotherapist\nNicol van Dyk\n, Ph.D., said that the move is simple and can be done anywhere, as long as your feet are secure and you can kneel comfortably.\nHere's how to do the move:\nBegin in a kneeling position with both ankles secured \u2014 tuck your feet under a bar, for example, or have a running buddy hold them down.\nThen, lean forward as slowly as possible while keeping your back straight, and your arms tucked in toward the body, usually with wrists crossed in front of your chest.\nWhen you can\u2019t resist anymore, fall forward in a controlled manner, catching yourself with your hands against the floor or ground.\n\u201cMany factors play a role in your running performance, but the simple truth is that hamstrings are a huge part in how well you run,\u201d van Dyk said. \u201cSpending a few minutes doing an exercise like this can reduce injury, and that's what a warm-up is all about.\"\nAnother option is to\nincorporate a foam roller\ninto your warm-up. Research\nsuggests\nthat foam rolling can increase blood flow to the muscles, improve range of motion, and may reduce inflammation. The trick with foam rolling is to do it before exercise in order to reap all of these benefits.\n\"Foam rolling can prepare the body for more high-intensity activity,\" said\nDiana Garrett\n,\nD.P.T., C.S.C.S., out-patient rehabilitation supervisor at the Performance Therapy Center at Providence Saint John's Health Center. \"This is true not just for your muscles but also for nerves and joints, since the increased blood flow affects them as well.\"\nAdjust Your Warm-Up to Match the Run\nThe duration, intensity, and type of exercises done in a warm-up often depends on what type of run or race you're going to do, Morris said."}, {"id": "7f6595d5-a674-4afd-9b16-d86030233273", "index": 3, "file_name": "dynamic_warmup_9.md", "category": "mobility", "topic": "Dynamic Warmup", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 1208, "text": "Adjust Your Warm-Up to Match the Run\nThe duration, intensity, and type of exercises done in a warm-up often depends on what type of run or race you're going to do, Morris said. For example, if you're just running a mile on a track during your lunch hour, the warm-up can be five minutes of dynamic stretches, with moves such as lunges, squats, and a couple of Nordic hamstring exercises, followed by five minutes of easy jogging before you speed up to your usual pace.\nFor speedwork, which involves building power\nthrough sprinting\n, it's better to prep your body with drills that involve some type of jumping, such as high knees, skipping, skaters, and bum kicks.\nLong run day or marathon? Morris said that's when your \"easy pace jog\" should be at least five minutes and accompanied by more dynamic stretches and a few minutes of vertical jumping. If you've run a long race before, it's likely you'll see plenty of other people doing those abrupt jumps as well, and Morris said those help with mental preparation as well as physical prep. That\u2019s because you literally shake out any jitters before you take your first step.\nWhat To Do When You Have an Injury\nWarming up is important in general, but it's even"}, {"id": "a0651ae8-76a8-48a9-965b-df09ab2a8e16", "index": 4, "file_name": "marathon_training_plan_14.md", "category": "training", "topic": "Marathon Training Plan", "experience_level": "all", "distance_tier": "marathon", "source": "Nike", "length": 1647, "text": "# Marathon Training Plan\n\nMarathon Training Plan\nThe Marathon is the ultimate road race. And the Marathon training journey is the ultimate running experience.\nBut we believe the marathon is about more than just running 26.2 miles. Whatever your reason to run, this comprehensive 18-week Training Plan is designed to provide holistic marathon coaching and guidance, every step of the way.\nGet the benefit of Guided Runs with Nike Run Club coaches, Nike Training Club workouts, and mindset, nutrition and recovery tips. Whether it\u2019s training your brain or making the most of a rest day, taking on a marathon challenge isn\u2019t just about miles, it\u2019s about you and your progress.\nLearn the strength-building benefits of Speed Runs, the physical and mental advantages of Long Runs, and the regenerative power of Recovery Runs through guidance from coaches and athletes who\u2019ve been there and run it.\nWe know training has to fit into your life, so whether you're 8 or 18 weeks from race day, or want to run 3, 4 or 5 days a week, we\u2019re here to guide you whenever you\u2019re ready\u2014as your coach, teammate, and biggest fan.\nWe\u2019ll meet you on the starting line!\nDownload NRC App\nDownload PDF Plan\nStart Your Marathon Journey\nWatch\n\u201cThe fundamental goal of marathon training is being able to cover the distance. And not just make it to the finish line, but make it to the finish line as best you can.\u201d\nChris Bennett\nNike Running Global Head Coach\nGet Started With Coach Bennett\nWatch\nProgram Overview\nHere\u2019s a sample of what your training will loo g manage medical expenses when care is required. Reviewing coverage options alongside your health goals allows you to make informed choices that align with both your lifestyle and budget.\nPersonalized Coverage\nCashless Hospitals\nQuick and Easy Claims\n24/7 Customer Service\n5% Discount on Website Purchase*\n* Terms & Conditions applied according to company policy\nDisclaimer\nBy submitting my details, I override my NDNC registration and authorize ManipalCigna Health Insurance and its representatives to contact me through call, RCS, Whatsapp or E-mail. I further consent to share my information on confidential basis with third parties for evaluating and processing this proposal.\nTL;DR (Quick Summary):\nAthletes Diet focuses on protein in every Indian meal and carb timing around training.\nCore Indian foods like dal, paneer, millets and chapati provide quality energy and recovery fuel.\nHydration and electrolytes are essential for Indian climate and exercise duration.\nA balanced plan includes pre and post workout meals with appropriate portions.\nMeal planning around travel days and long training blocks is practical and sustainable.\nCommon mistakes include skipping protein and overloading on fried foods\nAthletes Diet is a practical framework that aligns sport demands with Indian eating patterns. It focuses on protein in every meal, high quality carbohydrates for training days, and mindful fats for energy. The approach uses dal, paneer, yogurt, millets, chapati and vegetables as core building blocks for performance and recovery. Practical tips help athletes plan meals on travel days and workouts.\nWhat is Athletes Diet\nAthletes Diet is a practical framework that aligns sport demands with Indian eating patterns. It emphasizes protein at each meal, high quality carbohydrates for training days, and prudent fats for energy. Core building blocks include dal, paneer, yogurt, millets, chapati and vegetables to support performance and recovery.\nIn this approach Indian foods are viewed as performance tools. The aim is to meet energy needs, optimise muscle repair, boost immune function and sustain training stress without relying on exotic supplements."}, {"id": "213274b1-4776-47a2-9072-4c45e35741f3", "index": 9, "file_name": "athletes_diet_8.md", "category": "nutrition", "topic": "Athletes Diet", "experience_level": "all", "distance_tier": "all", "source": "Manipal Cigna", "length": 1075, "text": "In this approach Indian foods are viewed as performance tools. The aim is to meet energy needs, optimise muscle repair, boost immune function and sustain training stress without relying on exotic supplements. It is adaptable to different sports, ages and regional cuisines within India.\nKey ideas include meal timing around workouts, portion control, staying hydrated, and choosing nutrient dense options that fit Indian kitchens and schedules.\nHow Athletes Diet Works for Indian Athletes\nAthletes Diet for Indian athletes works by combining energy balance with sport specific timing. Carbohydrates fuel training and aid recovery, while protein rebuilds muscle after sessions. Healthy fats provide lasting energy and support hormones. Indian foods offer ready made sources for all macro needs, from dal and rice to chapati with ghee and yogurt.\nPractice points include aligning meals with training windows, using a pre workout snack 60 to 90 minutes before and a post workout meal within 2 hours. Hydration strategies include water plus electrolyte beverages in hot climates,"}, {"id": "efe877f1-35a9-409f-9c62-bb4c1e6bd9bb", "index": 10, "file_name": "electrolyte_importance_5.md", "category": "nutrition", "topic": "Electrolyte Importance", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 2286, "text": "# The Importance of Electrolytes for Body Processes\n\nElectrolytes are crucial for body processes such as conducting nerve impulses, contracting muscles, hydrating, and regulating pH levels. You need adequate electrolytes from your diet to keep your body healthy.\n\u201cElectrolyte\u201d is the umbrella term for particles that carry a positive or negative electric charge.\nIn nutrition, the term refers to essential minerals in your blood, sweat, and urine.\nWhen these minerals dissolve in a fluid, they form electrolytes \u2014 positive or negative ions in metabolic processes.\nElectrolytes found in your body include:\nsodium\npotassium\nchloride\ncalcium\nmagnesium\nphosphate\nbicarbonate\nThese electrolytes are necessary for various bodily processes, including proper nerve and muscle function, maintaining acid-base balance and keeping you hydrated.\nThis article examines electrolytes, their functions, the risk of imbalance, and possible sources.\nMaintaining vital body functions\nElectrolytes are\ncrucial\nfor keeping your nervous system and muscles functioning and your internal environment balanced.\nNervous system function\nYour brain sends electrical signals through your nerve cells to communicate with the cells throughout your body.\nThese signals are called nerve impulses, and they\u2019re generated by changes to the electrical charge of the nerve cell membrane.\nThe changes occur due to the movement of the electrolyte sodium across the nerve cell membrane.\nWhen this happens, it sets off a chain reaction, moving more sodium ions (and the change in charge) along the length of the\nnerve cell axon\n.\nMuscle function\nThe electrolyte calcium is needed for muscle contraction.\nIt allows muscle fibers to slide together and move over each other as the muscle shortens and contracts.\nMagnesium is also necessary in this process so that the muscle fibers can slide outward and muscles can relax after contraction.\nProper hydration\nWater must be kept in the right amounts both inside and outside each cell in your body.\nElectrolytes,\nparticularly\nsodium, help maintain fluid balance through osmosis.\nOsmosis is a process where water moves through the wall of a cell membrane from a dilute solution (more water and fewer electrolytes) toward a more concentrated solution (less water and more electrolytes)."}, {"id": "5d7ce64b-29a7-447c-a798-f28b0d4b5221", "index": 11, "file_name": "electrolyte_importance_5.md", "category": "nutrition", "topic": "Electrolyte Importance", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 2044, "text": "Osmosis is a process where water moves through the wall of a cell membrane from a dilute solution (more water and fewer electrolytes) toward a more concentrated solution (less water and more electrolytes).\nThis prevents cells from bursting from being too full or shriveling up due to dehydration.\nInternal pH levels\nTo stay healthy, your body needs to regulate its internal pH.\npH is a measure of how acidic or alkaline a solution is. In your body, it\u2019s regulated by chemical buffers, or weak acids and bases, which help minimize changes in your internal environment.\nFor example, your blood is regulated to stay at a pH of around 7.35 to 7.45. If it deviates from this, your body can\u2019t function properly, and you become unwell.\nHaving the right balance of electrolytes is fundamental to maintaining your blood pH level.\nElectrolyte imbalances\nIn some circumstances, electrolyte levels in your blood can become too high or low, causing an imbalance.\nDisturbances in electrolytes can have a harmful effect on your health and\ncan be fatal\nin severe cases.\nElectrolyte imbalances often occur due to dehydration\ncaused by\nexcess heat, vomiting or diarrhea. This is why it is important to be mindful of replacing any lost fluids when it\u2019s hot or when you\u2019re sick.\nSome conditions can increase the risk of electrolyte imbalances. These include:\nmalnutrition\nkidney disease\nendocrine\ndisorders\ngastrointestinal conditions\nlung conditions\nheart problems\nIf you have a mild electrolyte disturbance, you probably won\u2019t experience any symptoms.\nHowever, more severe imbalances can cause symptoms such as:\nfatigue\nmuscle weakness\nnausea\nheadache\nconfusion\nIf you suspect you have an electrolyte imbalance, be sure to discuss your symptoms with your doctor.\n\u00bb\nLearn more:\nAll About Electrolyte Imbalance\nDo you need to replace electrolytes lost in sweat?\nWhen you sweat, you lose both water and electrolytes, especially sodium and chloride.\nAs a result, long periods of exercise or activity, particularly in the heat, can cause significant electrolyte loss."}, {"id": "efca9653-79f8-49aa-a501-805ec8fc079f", "index": 12, "file_name": "electrolyte_importance_5.md", "category": "nutrition", "topic": "Electrolyte Importance", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 1129, "text": "When you sweat, you lose both water and electrolytes, especially sodium and chloride.\nAs a result, long periods of exercise or activity, particularly in the heat, can cause significant electrolyte loss.\nIt\u2019s estimated that sweat contains about\n40 to 60 millimoles (mmol) of sodium per liter\non average.\nBut the actual amount of electrolytes lost through sweat can vary from person to person.\nIn the United States, the maximum recommended intake for sodium is\n2,300 milligrams (mg)\nper day. As the average daily consumption of sodium is 3,400 mg per day, most people don\u2019t need to replace sodium lost from sweat.\nHowever, certain people, such as endurance athletes who are exercising regularly or those who exercise in extreme heat, may want to consider drinking electrolyte-enriched sports drinks to replace their losses.\n\u00bb\nLearn more:\nHealthy Drinks Rich in Electrolytes\nDietary sources of electrolytes\nBelow are some foods that provide electrolytes:\nSodium:\nPickled foods, rice, pasta, and condiments are\nsources of sodium\n.\nSodium chloride:\nTable salt is a source of chloride.\nPotassium:\nFruits and vegetables such as bananas,"}, {"id": "a16d12db-9631-4b8c-a9a8-2b252e3ca8d8", "index": 13, "file_name": "post_run_recovery_2.md", "category": "mobility", "topic": "Post Run Recovery", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 2163, "text": "# 5 Best Ways to Recover After a Run\n\n5 Best Ways to Recover After a Run\nActivity\nIncorporate these recovery strategies into your training routine to avoid overuse injuries.\nLast updated: February 25, 2025\n7 min read\nRecovery is critical for any runner, from the beginner learning to manage their mileage to the seasoned athlete going after their personal best.\n\u201cRecovery gives muscles, tendons and ligaments time to heal and rebuild, restoring energy levels and reducing inflammation,\u201d says Jay Silva, C.S.C.S., and RRCA-certified running instructor with TeachMe.To. \u201cIt also enhances performance by enabling consistent progress over time,\u201d he says.\nWhat Can Happen If You Don\u2019t Prioritize Recovery?\nWhen it comes to achieving your athletic goals, a consistent training plan isn\u2019t enough. Baking recovery strategies into your regimen is essential to improving your performance \u2014 and supporting your overall health. \u201cRecovery is essential for runners at all levels because it allows the body to repair, adapt and grow stronger after the physical stress running puts on the body,\u201d Silva says.\nRunning is a high-impact sport, which means it\u2019s harder on the body than a low-impact exercise like swimming. As Raquelle Felder, P.T., D.P.T., and owner of San Diego Mobile Rehab and Physical Therapy, points out, your muscles develop microtears after a tough workout. \u201cThese microtears are normal and are healed with proper recovery,\u201d she says. That\u2019s why the ideal training program includes a balance of both high- and low-impact movements that encourage recovery.\n\u201cWithout proper recovery, runners risk\novertraining\n, burnout and injuries that can sideline them for weeks or even months,\u201d Silva says. Prioritizing recovery also enables your body to repair damaged muscles so that they grow stronger and are prepared for the next workout.\nHow To Recover After a Run\nThere are so many ways you can boost your recovery post-run. Ahead, learn which recovery strategies are most effective for runners so you continue to train sustainably.\n1. Refuel immediately after your workout\nRecovery begins with fuel, says Leo Hipp, a performance physiologist at Human Powered Health."}, {"id": "ea150c4f-2807-44e6-a796-bc00badc5232", "index": 14, "file_name": "post_run_recovery_2.md", "category": "mobility", "topic": "Post Run Recovery", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 1963, "text": "Ahead, learn which recovery strategies are most effective for runners so you continue to train sustainably.\n1. Refuel immediately after your workout\nRecovery begins with fuel, says Leo Hipp, a performance physiologist at Human Powered Health. The sooner you can begin refueling post-workout, the faster your muscles get the nutrients they need to repair and rebuild. \u201cYour body burns carbohydrates and fats for energy, so it\u2019s important to replenish those after exercise,\u201d he says.\nSilva recommends refueling 30 to 60 minutes after a run to optimize your recovery. He also recommends prioritizing complex carbs over simple ones (Think: cereals and fruit juices) to replenish glycogen stores (carbohydrates that are stored in the body for energy). \u201cSweet potatoes, rice or oats are great complex carb options,\u201d Silva says.\nProtein intake is also a crucial component of recovery. \u201cWhile you don\u2019t burn protein for energy, your muscles use protein in order to support movement,\u201d Hipp says. Consuming adequate protein also supports muscle repair and growth. The\nInternational Society of Sports Nutrition (ISSN)\nrecommends consuming a high-quality protein meal or snack within two hours of finishing your workout. \u201cAim to refuel with a 3:1 or 4:1 carb-to-protein ratio, such as a smoothie with a banana and protein powder,\u201d Silva says.\nDon\u2019t forget to add some healthy fats to your post-run meal or snack. \u201cHealthy fats support overall recovery and help to reduce inflammation,\u201d Felder says. Omega-3 fatty acids, in particular, have\nshown promise\nin combating post-workout inflammation and muscle damage. Salmon, flaxseed and certain nuts like walnuts are just a\nfew examples of foods\nthat are naturally rich in these inflammation-fighting fatty acids.\n2. Hydrate and replenish with electrolytes\n\u201cProper hydration is a cornerstone of recovery, as fluid and electrolyte losses during running can lead to dehydration, fatigue or cramping if not replenished,\u201d Silva says."}, {"id": "3c1e8307-31cb-4eb8-b58e-62ebbe07f41c", "index": 15, "file_name": "post_run_recovery_2.md", "category": "mobility", "topic": "Post Run Recovery", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 1368, "text": "2. Hydrate and replenish with electrolytes\n\u201cProper hydration is a cornerstone of recovery, as fluid and electrolyte losses during running can lead to dehydration, fatigue or cramping if not replenished,\u201d Silva says. \u201cDrinking water immediately after a run is important, but for longer runs or those in hot conditions, it\u2019s equally vital to replace lost electrolytes such as sodium, potassium and magnesium.\u201d\nThese three\nelectrolytes are important for your recovery and overall health\n, and you lose all three after a workout, primarily via sweat \u2014 but\nespecially sodium\n. \u201cElectrolyte tablets, sports drinks or coconut water can help restore this balance,\u201d Silva says. Consuming enough electrolyte-rich fluids can also help you get ahead of sore muscles. \u201cHydrating not only supports transportation of nutrients to the muscles in the body, but it also helps prevent\ndelayed-onset muscle soreness\n,\u201d Silva says.\n3. Stretch, foam roll or self-massage\nDynamic stretching\n, or stretching that requires movement, is key to rehabbing muscles after a workout. Walking lunges, arm circles and hip CARS (controlled articular rotations) are all examples of dynamic stretches that encourage joints to move through their full range of motion. Incorporating these light, mobility-focused movements into your recovery regimen relaxes tight muscles, enhances flexibility and promotes"}, {"id": "fc4bab8a-260e-4ef2-8fe3-a2eafb0ff140", "index": 16, "file_name": "common_running_injuries_19.md", "category": "mobility", "topic": "Common Running Injuries", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1841, "text": "# Preventing and Treating Common Running Injuries\n\nWritten by\nHedy Marks\nMedically Reviewed by\nRoss Brakeville,\u00c2\u00a0DPT\non May 05, 2026\nRunning injuries\nusually happen when you push yourself too hard. The way your body moves also plays a role.\nYou can prevent many of them. Here's how.\n1. Runner's\nknee\n.\nThis is a common overuse injury. Runner's knee\u00c2\u00a0(often called Patellofemoral syndrome) has several different causes. It often happens when your kneecap is out of alignment.\nOver time, the cartilage on your kneecap can wear down. When that happens, you may feel pain around the kneecap, particularly when:\nGoing up or down stairs\nSquatting\nSitting with the knee bent for a long time\n2. Stress fracture.\nThis is a small crack in a bone that causes pain and discomfort. It typically affects runners in the shin and feet. It's often due to working too hard before your body gets used to a new activity.\nPain gets worse with activity and improves with rest. Rest is important, as continued stress on the bone can lead to more serious injury and slow down recovery.\n3. Shin splint.\nThis is pain that happens in the front or inside of the lower leg along the shin bone (tibia).\nShin splints\n\u00c2\u00a0(also called medial tibial stress syndrome or MTSS) are common after changing your workout, such as running longer distances or increasing the number of days you run, too quickly.\u00c2\u00a0 Pain-wise, they can be hard to distinguish from a stress fracture of the shin, but the pain is usually more spread out along the bone. Also, an\u00c2\u00a0X-ray is normal to determine which one you have.\nPeople with hypermobile feet/arches are more likely to develop shin splints.\nTreatment includes:\nReduce your mileage\u00c2\nSlow your pace\nStrengthening exercises\n4. Achilles\ntendinopathy\n.\u00c2\nFormerly called tendinitis, this is\u00c2\u00a0a chronic degenerative change to\u00c2\u00a0the\nAchilles tendon\n."}, {"id": "3d806188-6fcc-432c-8fff-be018efc8e42", "index": 17, "file_name": "common_running_injuries_19.md", "category": "mobility", "topic": "Common Running Injuries", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1852, "text": "Achilles\ntendinopathy\n.\u00c2\nFormerly called tendinitis, this is\u00c2\u00a0a chronic degenerative change to\u00c2\u00a0the\nAchilles tendon\n. That's the large tendon that attaches the\ncalf\nto the back of the heel.\nAchilles tendinitis causes pain or burning and stiffness in the area of the tendon, especially in the morning and with activity. It is usually caused by repetitive stress to the tendon. Adding too much distance to your running routine can cause it.\u00c2\nTreatment includes:\nRest\nIcing the area\nCalf stretches\nHip and lower leg strengthening\n5. Muscle pull.\nThis is a small tear in your muscle, also called a\nmuscle strain\n. It's often caused by overstretching a muscle and weakness. If you pull a muscle, you may feel a popping sensation when the muscle tears.\nTreatment includes RICE: rest, ice, compression, and elevation.\nMuscle pull commonly affects these muscles:\nHamstrings\nQuadriceps\nCalf\nGroin\n6.\nAnkle sprain\n.\nThis is the accidental stretching or tearing of ligaments surrounding the\nankle\n. It often happens when the foot twists or rolls inward.\nSprains typically get better with rest, ice, compression, and elevating the foot.\n7.\nPlantar fasciitis\n.\nAn inflammation of the plantar fascia. That's the thick band of tissue in the bottom of the foot that extends from the heel to the toes. It usually presents with severe heel pain, especially with the first steps in the morning.\u00c2\nPeople with tight calf muscles and a high arch are more prone to plantar fasciitis. Although it may be linked to adding activity, plantar fasciitis can also happen without any obvious reason.\nTreatment includes:\nCalf stretches\nRest\nIcing the bottom of the foot\nWearing good shoes at all times (even at home or on the beach)\nStrengthening core, hips, and legs to reduce strain on the foot\n8. IT (iliotibial) band syndrome.\nThis syndrome causes pain on the outside of the knee."}, {"id": "03b4986b-f172-48b8-b982-656621b8347f", "index": 18, "file_name": "common_running_injuries_19.md", "category": "mobility", "topic": "Common Running Injuries", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1558, "text": "IT (iliotibial) band syndrome.\nThis syndrome causes pain on the outside of the knee. The IT band is a ligament that runs along the outside of the thigh, from the top of the hip to the outside of the knee.\nIT band syndrome happens when this ligament thickens and rubs the knee bone, causing inflammation.\nTreatment includes:\nCutting back on exercise\nHeat and stretching before exercise\nIcing the area after activity\n9.\nBlisters\n.\nThese are fluid-filled sacks on the surface of the\nskin\n. They are caused by friction between your shoes/socks and skin.\nTo help prevent blisters:\nStart using new shoes gradually\nWear socks with a double layer\nApply petroleum jelly to areas prone to blisters\n10. Temperature-related injuries.\nThese include\n:\nSunburn\nHeat exhaustion\nFrostbite\nHypothermia\nYou can prevent these by dressing appropriately, staying hydrated, and using\nsunscreen\n.\nTips to Prevent Running Injuries\nBy taking a few precautions and planning, you can prevent many common running injuries. Here are some tips for preventing injuries.\nListen to your body:\nDon't ignore pain. A little soreness is OK. But if you notice consistent pain in a muscle or joint that doesn't get better with rest, see your health care provider.\nCreate a running plan:\nBefore beginning a running routine, talk to a trainer. A trainer can help you create a running plan that is in line with your current fitness abilities and long-term goals.\nWarm-up and stretch:\nMany injuries occur as a result of inadequate stretching. Before running, you should warm up with basic strengthening"}, {"id": "969b817b-1e40-4d93-8b6c-1ea06d8686e4", "index": 19, "file_name": "how_to_start_running_15.md", "category": "training", "topic": "How To Start Running", "experience_level": "beginner", "distance_tier": "all", "source": "Nike", "length": 2025, "text": "# How To Start Running: A Beginner\u2019s Guide\n\nHow To Start Running: A Beginner\u2019s Guide\nActivity\nWhether you're new to running or want a refresher, use this guide to learn how to start running safely with beginner tips, a simple run-walk plan, gear advice, and motivation strategies from run coaches.\nLast updated: March 26, 2026\n15 min read\nRunning is one of the simplest ways to improve\ncardiovascular fitness\n, strengthen muscles, and boost mental health. But if you\u2019re new to running, it can be daunting to figure out where to start. This beginner\u2019s guide explains exactly how to start running safely, build endurance, and stay consistent, even if you\u2019ve never run before.\nBefore starting a running program, it\u2019s important to consult a health care professional, especially if you have any concerns or preexisting conditions. Stop and seek medical care if you experience chest pain, severe shortness of breath, or joint pain that worsens while running.\nAt a Glance: How To Start Running\nAssess your fitness\nSet realistic goals\nChoose gear\nUse run-walk intervals\nSchedule: 3 days per week\nWarm up\nCool down\nRest and recovery\nAssess Your Fitness\nBefore lacing up your shoes, you\u2019ll want to spend time thinking about your fitness history and how active you are on a daily basis. \u201cThere\u2019s a lot of people who consider themselves beginners, but they\u2019re not,\u201d says coach\nKristen Hislop\n, AFAA CPT, USAT Level 1. You might be new to running, but maybe you regularly strength train, or you used to play sports in high school. Your current physical fitness plays a role in figuring out where to start and how quickly to progress.\n\u201cI think the biggest mistake that people tend to make in this stage is not being truly honest with the coach or with themselves as to where they are starting,\u201d says\nChanning Muller\n, RRCA-certified run coach.\nSet Realistic Goals\nNext, you want to identify your goals. \u201cI think the most important thing is to set up realistic expectations,\u201d says\nDoug Guthrie\n, USAT Level 1 and US Masters certified coach."}, {"id": "413743af-b81a-4ff4-9f26-d37280b78c28", "index": 20, "file_name": "how_to_start_running_15.md", "category": "training", "topic": "How To Start Running", "experience_level": "beginner", "distance_tier": "all", "source": "Nike", "length": 2013, "text": "Set Realistic Goals\nNext, you want to identify your goals. \u201cI think the most important thing is to set up realistic expectations,\u201d says\nDoug Guthrie\n, USAT Level 1 and US Masters certified coach. \u201cPeople will overestimate what they can do in the short run and underestimate what they can do in the long run.\u201d\nStart small. One of the biggest pitfalls for new runners is taking on too much too fast, which can lead to burnout or even injury. \u201cWhen you start and go from zero to 13.1, that's a big load to take on,\u201d Hislop says. Instead, she emphasizes starting with a goal that fits into your current lifestyle, which makes it more likely to become a practice you value.\nPro tip:\nWhen setting goals, don\u2019t compare yourself to other runners. \u201cDon\u2019t get caught up in the comparison game. Remember that everybody has started from somewhere,\u201d adds Muller.\nChoose Your Gear\nHaving the right gear is an important part of a successful beginner running experience. But that doesn\u2019t mean you have to go out and buy everything at once. \u201cKeeping it simple is best, especially with the new runner,\u201d Guthrie says.\nWhat You Need vs. What\u2019s Optional\nHow do you know what you need? Muller\u2019s pro tip is to focus on what goes immediately against your body. This includes running shoes, a\nhigh-impact sports bra\nfor women, and\nshorts\nwith compression.\nWhen it comes to\npicking the right shoes\n, all our experts recommend going to a running store to get fitted. At the store, they\u2019ll watch you walk and, based on your\npronation\n, will likely recommend different styles like neutral or stability running shoes. Make sure to walk around the store or, if they have a treadmill, run in the shoes, to find out what\u2019s most comfortable.\nPro tip:\nHislop says to go shopping for running shoes at the end of the day when your feet are swollen. \u201cIf the shoe is too tight at the end of the day, then it's definitely going to be too tight when you run.\u201d\nNext, you\u2019ll want to consider a GPS watch or running app, which can monitor pace and distance."}, {"id": "2131dc8c-5b77-41c7-9006-3e99177a6a4f", "index": 21, "file_name": "how_to_start_running_15.md", "category": "training", "topic": "How To Start Running", "experience_level": "beginner", "distance_tier": "all", "source": "Nike", "length": 1402, "text": "\u201cIf the shoe is too tight at the end of the day, then it's definitely going to be too tight when you run.\u201d\nNext, you\u2019ll want to consider a GPS watch or running app, which can monitor pace and distance. The\nNike Run Club (NRC)\napp has additional\nfeatures\n, such as audio-guided runs and training plans, to help you tackle your first race.\nAdditional gear comes down to preference, climate and what makes you the most comfortable. Sunglasses, a hat, sunscreen and antichafing products can make a run much more pleasant, especially on hot, sunny days. And running in\ncold weather\nor the\nrain\nmight require gloves or a rain jacket to stay warm and dry. You might also consider a hydration vest, water bottle, or gels.\nUse Run-Walk Intervals\nA great starting place for beginners is to utilize the Run-Walk-Run\u00ae method, a practice popularized by Olympic runner Jeff Galloway. \u201cI pretty much start everybody with a run-walk program to get started because that\u2019s the easiest way to progress with less impact on the body,\u201d Hislop says.\nDuring a workout, you\u2019ll alternate between running and walking, each for a specified amount of time. The amount of time you spend on each will depend on your fitness.\nThe 4-Week Get Started Training Plan\nIf you\u2019re itching to start running, it\u2019s essential that you start running the right way. You\u2019ll need guidance, motivation, and inspiration when you get to the starting lin"}, {"id": "8bc8ce2a-67ab-45a9-af29-4728e2405563", "index": 22, "file_name": "shin_splints_23.md", "category": "mobility", "topic": "Shin Splints", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1881, "text": "# What Are Shin Splints?\n\nWritten by\nKendall K. Morgan\nMedically Reviewed by\nBrunilda Nazario,\u00c2\u00a0MD\non June 24, 2025\nWhat Are Shin Splints?\nShin splints are when you have pain anywhere along your shin bone or tibia. Your tibia is the big bone that starts under your knee and runs down the front of your lower leg. The pain happens where your muscles attach to your shins. Shin splints are a common problem when you exercise a lot in ways that put stress on your lower legs.\nIf you have shin splints, your doctor also might call it medial tibial stress syndrome. That's another name for the painful inflammation you get when you overwork and stress the muscles, tendons, and bone in your shins.\nTypes of shin splints\nSometimes, you might see shin splints described as different types, such as anterior, medial, or posterior. These names relate to the different parts of your leg (front, middle, or back) and the\nmuscles\nwhere you feel your pain. For example, you'll feel medial shin splints on the inner side of your shin, while anterior shin splints are on the outer side.\nBut shin splints aren't a specific injury with distinct types. It's a general name for pain along the front of your lower legs from overuse or stress. The most common place to feel pain in your shins is on the inner side.\nShin splints vs. stress fractures\nOther conditions can make your shins hurt, too. If you have what you think are shin splints and they aren't getting better, check with your doctor to make sure you don't have a stress fracture in your tibia or some other condition.\nWhile shin splints come with pain and inflammation, a stress fracture is a small crack in your bones. Both shin splints and stress fractures can happen when you put too much stress on the muscles, tendons, and bones in your lower legs. If you have shin splints and you don't rest, you could end up with a stress fracture."}, {"id": "b7c0345c-ee38-4a79-9617-3c8b475b5240", "index": 23, "file_name": "shin_splints_23.md", "category": "mobility", "topic": "Shin Splints", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1980, "text": "If you have shin splints and you don't rest, you could end up with a stress fracture.\nShin Splint Symptoms\nCommon symptoms of shin splints include:\nDull pain or aching down the front of one or both of your shins\nShins that hurt when you touch them\nShin pain that gets worse when you exercise\nPain in your shins that gets better with rest\nMild swelling around your lower legs\nWhat do shin splints feel like?\nWhen you have shin splints, you might not feel them all the time. You might only feel it when you're running or exercising some other way that puts stress on your shins. As your\nshin splints\nget worse, you might start to feel the pain all the time.\nShin Splint Causes\nYou can get shin splints if you do the same exercises or motions many times in ways that put stress on the muscles, tendons, and bones around your shins. You could get them if you make sudden changes in your exercise routine, such as exercising harder, more often, or for a longer time. You might also get shin splints if you exercise with shoes that don't fit you well or are worn out.\nSome forms of exercise are more likely to cause shin splints than others. Examples include:\nRunning\nDancing\nMilitary training\nBut any type of exercise that puts a lot of stress on your lower legs could cause shin splints.\nRisk Factors for Shin Splints\nSome people are more likely to get shin splints than others. Your choices about exercise can also put you at more risk for shin splints. Risk factors for shin splints include:\nRunning, especially on uneven ground, uphill, or on hard surfaces like concrete\nWearing shoes that don't fit well or lack support\nHaving feet that are very flat or inflexible\nBeing\noverweight\nNot warming up before exercise\nNot stretching after exercise\nHaving a vitamin D deficiency\nHaving an eating disorder\nHaving bones that are weaker than they should be\nThe way your ankles and hips connect to your legs and how they move when you walk or run also can affect your risk for shin splints."}, {"id": "4f216cd0-698c-4f64-98eb-2965ba6c6f99", "index": 24, "file_name": "shin_splints_23.md", "category": "mobility", "topic": "Shin Splints", "experience_level": "all", "distance_tier": "all", "source": "WebMD", "length": 1248, "text": "If you exercise a lot and are worried about shin splints, ask your doctor about your risk and what you can do to lower it.\nShin Splint Treatment\nShin splints often get better without treatment within a few weeks. But there are steps you can take to heal faster.\nRest your legs.\nYou can still be active, but choose activities that won't make your shin splints worse, such as swimming or biking.\nIce your shins.\nUse ice packs for 20-30 minutes several times a day for a few days or until the pain is gone.\nUse insoles or orthotics for your shoes.\nShoe inserts\u00e2\u0080\u0094which can be custom-made or bought off the shelf\u00e2\u0080\u0094may help if you have flat feet or weak ankles.\nTry compression.\nWearing a compression bandage or sock may help if you have swelling.\nReplace your shoes.\nIf your shoes don't have enough support or are worn out, get a new pair that will cut down on\nstress\nto your shins. Ask your doctor or an expert in sports medicine how to find the best running shoes for shin splints.\nTake anti-inflammatory painkillers if you need them.\nNonsteroidal anti-inflammatory drugs (NSAIDs), like\u00c2\u00a0aspirin,\u00c2\u00a0ibuprofen, or\u00c2\u00a0naproxen, will help with pain and swelling. These drugs can have side effects, though, like a greater chance of bleeding and ulcers. Use"}, {"id": "5735b1f0-6376-446f-b013-0bb8121173c4", "index": 25, "file_name": "micronutrients_and_athletic_performance_24.md", "category": "nutrition", "topic": "Micronutrients And Athletic Performance", "experience_level": "all", "distance_tier": "all", "source": "PMC/NIH", "length": 1416, "text": "# Exploring the Relationship between Micronutrients and Athletic Performance\n\nSports (Basel)\n. 2023 May 24;11(6):109. doi:\n10.3390/sports11060109\nExploring the Relationship between Micronutrients and Athletic Performance: A Comprehensive Scientific Systematic Review of the Literature in Sports Medicine\nHadeel Ali Ghazzawi\nHadeel Ali Ghazzawi\n1\nDepartment Nutrition and Food Technology, School of Agriculture, The University of Jordan, Amman 11942, Jordan; manar_jaradat98@outlook.com (M.J.); sondosalobaidi@gmail.com (S.A.);\nFind articles by\nHadeel Ali Ghazzawi\n1,\n*\n,\nMariam Ali Hussain\nMariam Ali Hussain\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\nFind articles by\nMariam Ali Hussain\n2\n,\nKhadija Majdy Raziq\nKhadija Majdy Raziq\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\nFind articles by\nKhadija Majdy Raziq\n2\n,\nKhawla Khaled Alsendi\nKhawla Khaled Alsendi\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A."}, {"id": "30be9032-ebc7-4ee4-ac9d-f5ffeeab9532", "index": 26, "file_name": "micronutrients_and_athletic_performance_24.md", "category": "nutrition", "topic": "Micronutrients And Athletic Performance", "experience_level": "all", "distance_tier": "all", "source": "PMC/NIH", "length": 1117, "text": "); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\nFind articles by\nKhawla Khaled Alsendi\n2\n,\nReem Osama Alaamer\nReem Osama Alaamer\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\nFind articles by\nReem Osama Alaamer\n2\n,\nManar Jaradat\nManar Jaradat\n1\nDepartment Nutrition and Food Technology, School of Agriculture, The University of Jordan, Amman 11942, Jordan; manar_jaradat98@outlook.com (M.J.); sondosalobaidi@gmail.com (S.A.);\nFind articles by\nManar Jaradat\n1\n,\nSondos Alobaidi\nSondos Alobaidi\n1\nDepartment Nutrition and Food Technology, School of Agriculture, The University of Jordan, Amman 11942, Jordan; manar_jaradat98@outlook.com (M.J.); sondosalobaidi@gmail.com (S.A.);\nFind articles by\nSondos Alobaidi\n1\n,\nRaghad Al Aqili\nRaghad Al Aqili\n1\nDepartment Nutrition and Food Technology, School of Agriculture, The University of Jordan, Amman 11942, Jordan; manar_jaradat98@outlook.com (M.J.); sondosalobaidi@gmail.com (S.A."}, {"id": "fbd09a6b-dda5-431b-bd95-7762606d8bae", "index": 27, "file_name": "micronutrients_and_athletic_performance_24.md", "category": "nutrition", "topic": "Micronutrients And Athletic Performance", "experience_level": "all", "distance_tier": "all", "source": "PMC/NIH", "length": 1513, "text": "); sondosalobaidi@gmail.com (S.A.);\nFind articles by\nRaghad Al Aqili\n1\n,\nKhaled Trabelsi\nKhaled Trabelsi\n3\nHigh Institute of Sport and Physical Education of Sfax, University of Sfax, Sfax 3000, Tunisia\n4\nResearch Laboratory\u2014Education, Motricity, Sport and Health, University of Sfax, Sfax 3000, Tunisia\nFind articles by\nKhaled Trabelsi\n3,\n4\n,\nHaitham Jahrami\nHaitham Jahrami\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\n5\nGovernment Hospitals, Ministry of Health, Manama 323, Bahrain\nFind articles by\nHaitham Jahrami\n2,\n5,\n*\nEditors:\nAndrew Hatchett\n,\nVirginia Tancredi\nAuthor information\nArticle notes\nCopyright and License information\n1\nDepartment Nutrition and Food Technology, School of Agriculture, The University of Jordan, Amman 11942, Jordan; manar_jaradat98@outlook.com (M.J.); sondosalobaidi@gmail.com (S.A.);\n2\nDepartment of Psychiatry, College of Medicine and Medical Sciences, Arabian Gulf University, Manama 323, Bahrain; mariamahh@agu.edu.bh (M.A.H.); khadijamz@agu.edu.bh (K.M.R.); khawlaalsendy948@gmail.com (K.K.A.);\n3\nHigh Institute of Sport and Physical Education of Sfax, University of Sfax, Sfax 3000, Tunisia\n4\nResearch Laboratory\u2014Education, Motricity, Sport and Health, University of Sfax, Sfax 3000, Tunisia\n5\nGovernment Hospitals, Ministry of Health, Manama 323, Bahrain\n*\nCorrespondence:\nh.ghazzawi@ju.edu.jo\n(H.A.G."}, {"id": "e7a41805-908b-4d53-9542-b9761e0e3317", "index": 28, "file_name": "micronutrients_and_athletic_performance_24.md", "category": "nutrition", "topic": "Micronutrients And Athletic Performance", "experience_level": "all", "distance_tier": "all", "source": "PMC/NIH", "length": 1133, "text": ");\nhaitham.jahrami@outlook.com\n(H.J.)\nRoles\nAndrew Hatchett\n:\nAcademic Editor\nVirginia Tancredi\n:\nAcademic Editor\nReceived 2023 Mar 13; Revised 2023 May 15; Accepted 2023 May 18; Collection date 2023 Jun.\n\u00a9 2023 by the authors.\nLicensee MDPI, Basel, Switzerland. This article is an open access article distributed under the terms and conditions of the Creative Commons Attribution (CC BY) license (\nhttps://creativecommons.org/licenses/by/4.0/\n).\nPMC Copyright notice\nPMCID: PMC10302780\u00a0\u00a0PMID:\n37368559\nAbstract\nThe aim of this systematic review is twofold: (i) to examine the effects of micronutrient intake on athletic performance and (ii) to determine the specific micronutrients, such as vitamins, minerals, and antioxidants, that offer the most significant enhancements in terms of athletic performance, with the goal of providing guidance to athletes and coaches in optimizing their nutritional strategies. The study conducted a systematic search of electronic databases (i.e., PubMed, Web of Science, Scopus) using keywords pertaining to micronutrients, athletic performance, and exercise. The search involved particular crite"}, {"id": "5e18d80a-819f-48bf-878a-5182fe386497", "index": 29, "file_name": "post_run_stretching_10.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 2098, "text": "# Best Stretches to Do Right After Running\n\nThese Are Some of the Best Stretches to Do Right After Running\nSports & Activity\nOnce you\u2019re done with your run, hit the mat and begin the recovery process with these stretches.\nLast updated: May 9, 2024\n6 min read\nAfter going for a run, you may notice that your body feels sore \u2014 a key indicator that both rest and recovery are needed.\nAnd a critical part of your recovery process involves stretching. When the muscles are warm, they are more flexible. Stretching them at this point can improve range of motion and accelerate recovery. More specifically, stretching right after a run can help reduce muscle and joint stiffness that can occur post-workout, known as delayed onset muscle soreness (DOMS).\nIt\u2019s essential to stretch after a run, and you may even incorporate stretches into your pre-run routine. As a part of your\nwarmups\n, you can add in a few dynamic stretches such as leg swings, spinal rotations, and arm circles. These exercises gently warm up your muscles so that they're ready for more intense activity. After your workout is done, you\u2019ll want to perform static (doesn't involve motion) stretches.\nBut first, it's always a good idea to start your post-run recovery routine with a cooldown. This involves reducing the intensity of the exercise for about 5-10 minutes. You might lightly jog or walk or perform another aerobic exercise at an easy effort level. The goal is to slowly let your heart rate come back down while your muscles are still warm. This will allow you to hold stretches for longer, minus all of the huffing and puffing.\nOnce your cooldown is complete, you can begin static stretches. These are isometric holds (a form of static stretches) that stretch those muscles that have been hard at work throughout the duration of your run.\nDon't miss\nWhat Are the Best Shoes for Long-Distance Running\n!\nWhy Static Stretching After a Run is Important for Recovery\nStretching may help to reduce the chances of developing certain running injuries, primarily\nshin splints\n. However, the research around this\nremains a bit mixed\n."}, {"id": "57b04da8-ed37-425a-a1ec-f0e834237a3f", "index": 30, "file_name": "post_run_stretching_10.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 2136, "text": "Why Static Stretching After a Run is Important for Recovery\nStretching may help to reduce the chances of developing certain running injuries, primarily\nshin splints\n. However, the research around this\nremains a bit mixed\n. What most exercise scientists can agree on, though, is that stretching can contribute to injury prevention via two main mechanisms:\nStretching can\nincrease range of motion (ROM)\nStretching can\nincrease blood flow\nWhen you stretch warm muscles, you can increase their ROM. This directly transfers into your running performance. Tight muscles with a restricted ROM negatively impact running economy and can lead to injuries. In fact, a 2019\nstudy\nexamined the effects of calf stiffness. In short, the researchers found it affected balance and gait ability (aka how you walk) in a small group of participants.\nIncreasing blood flow to the working muscles after exercise can accelerate recovery. Blood circulation transports nutrients to the muscles and filters out waste products such as lactic acid. This can reduce the symptoms associated with delayed onset muscle soreness, which can\npresent\nas muscle stiffness, tightness, tenderness, swelling, or decreased strength of the exercised muscle.\nSo, the more consistently you include stretching you into your post-run routine, the more you enhance your recovery. This can then allow you to feel less sore, and more prepared, for your next workout.\nThe Best Post-Run Stretches\nHamstring Stretch\nTight hamstrings are a common complaint made by runners. This can happen due to poor running form. If you over-stretch your hamstrings by taking strides that are too long, the result might be tight hamstrings. Here\u2019s your solution.\nLay on your back with feet planted in front of you.\nRaise your right leg towards you and hold on to the back of it with both hands, fingers interlocked.\nExhale as you slowly encourage your leg towards you.\nHold for 30 seconds.\nSwitch legs.\nStanding Quad Stretch\nIf you\u2019ve been\nrunning uphill\n, you\u2019re bound to have some burned-out quads. Even for long-distance runners on flat land, the quadriceps are one of the most common aches post-run."}, {"id": "b5d663dd-be26-4d4f-b41a-b5e666cd936b", "index": 31, "file_name": "post_run_stretching_10.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Nike", "length": 1232, "text": "Standing Quad Stretch\nIf you\u2019ve been\nrunning uphill\n, you\u2019re bound to have some burned-out quads. Even for long-distance runners on flat land, the quadriceps are one of the most common aches post-run. That\u2019s because they\u2019re so important for absorbing the shock of impact, stabilizing the knee, and propelling you forward.\nStart in a standing position with your feet together.\nRaise your right foot up from the ground and grab it with your right hand.\nKeep your knees as close together as possible.\nGently pull your heel towards your glutes.\nHold for 20\u201330 seconds.\nSwitch to the other leg.\nPigeon Stretch\nYou can thank your hip flexors for each stride you take. These muscles allow flexion at the hip joint, allowing you to swing your legs forward without toppling over. But tight hips and a tight groin can be common, especially if you have a job that requires hours of sitting. Here\u2019s your relief.\nSit on the floor with your feet together and knees out wide.\nAdjust your positioning so that your right foot and right shin stay put while your leg left is straightened behind you.\nYour knee may need to come inwards but keep your right ankle in front of your left hip and your hips square.\nTry to lower your upper body towards the g"}, {"id": "e39e5e79-1443-4009-8d81-515af58f42ec", "index": 32, "file_name": "runner_s_knee_pain_22.md", "category": "mobility", "topic": "Runner'S Knee Pain", "experience_level": "all", "distance_tier": "all", "source": "Medical News Today", "length": 2017, "text": "# Understanding Runner's Knee Pain\n\nRunner\u2019s knee refers to pain around the kneecap and in the front of the knee joint. It is a common issue for runners and athletes who participate in large amounts of running and jumping.\nRunner\u2019s knee, also known as patellofemoral syndrome, often affects athletes and people who participate in high impact activities such as running, basketball, and soccer.\nHowever, anyone can develop runner\u2019s knee. It is one of the most common causes of anterior, or front, knee pain in adolescents and adults under 60 \u2014 about\n3\u20136%\nof people in the United States have the condition.\nThe primary feature of runner\u2019s knee is pain in or around the front of the knee that worsens when flexed or during weight-bearing activities. The pain may increase after long periods of sitting with the knees bent, such as when driving a car or sitting at a desk.\nRead more to learn about runner\u2019s knee, its causes, symptoms, and treatment options.\nWhat is runner\u2019s knee?\nShare on Pinterest\nClique Images/Stocksy\nThe\nknee\nis a complex joint, and knee pain and other issues are relatively common. Runner\u2019s knee pain occurs when the patella \u2014 kneecap \u2014 does not slide smoothly over the femur, or thighbone.\nThe kneecap is a small bone that sits in front of the knee joint. It connects the quadriceps muscles \u2014 the large muscles in the front of the thigh \u2014 to the shinbone.\nIf the quadriceps muscles are too weak or too tight, they can cause the kneecap to track improperly. This can lead to friction and irritation of the cartilage under the kneecap, causing pain and\ninflammation\nin the knee joint.\nSome cases of runner\u2019s knee involve a condition called\nchondromalacia patella\n. This causes the articular cartilage under the kneecap to soften and break down.\nThe articular cartilage has no nerves, so it cannot directly cause pain. However, it can lead to inflammation of the connective tissue and pain in the bone.\nSymptoms\nDull, aching pain around or behind the kneecap is the hallmark symptom of runner\u2019s knee."}, {"id": "cbe18a0b-fc8a-4ce3-9d51-eea6c452786a", "index": 33, "file_name": "runner_s_knee_pain_22.md", "category": "mobility", "topic": "Runner'S Knee Pain", "experience_level": "all", "distance_tier": "all", "source": "Medical News Today", "length": 2078, "text": "However, it can lead to inflammation of the connective tissue and pain in the bone.\nSymptoms\nDull, aching pain around or behind the kneecap is the hallmark symptom of runner\u2019s knee. The pain usually worsens after exercise and eases with rest, and it may be present in one or both knees.\nOther symptoms\ninclude\n:\npain during activities that repeatedly bend the knee, such as using stairs, running, or jumping\npain in the front of the knee after sitting for long periods with the knees bent\npopping or crackling sounds in the knee\nHowever, it is important to note that cracking sounds in the knee joint are not always a sign of an issue. These sounds are known as\ncrepitus\n\u2014 if they are not accompanied by pain and do not cause any mobility issues, they are likely harmless.\nTreatments\nTreatment for runner\u2019s knee aims to reduce pain, improve patellar tracking, and return the person to their previous activity level.\nThe first line of treatment usually involves activity modification,\nnonsteroidal anti-inflammatory drugs (NSAIDs)\n, and other conservative measures such as ice and rest.\nStudies have shown\nthat NSAIDs, specifically\nnaproxen\n, decrease pain compared to aspirin and a\nplacebo\n. However, doctors do not recommend them for long-term treatment, so they should only be a short-term pain management strategy.\nDoctors commonly recommend using the\nRICE method\n:\nRest:\nFor several days, avoid activities that increase pain.\nIce:\nApply wrapped cold packs for 20 minutes several times per day.\nCompression:\nLightly wrap the knee in an elastic bandage with a gap over the kneecap. Ensure the bandage fits snugly and does not cause pain or cut off circulation.\nElevation:\nElevate the knee higher than the heart whenever possible. A person can try lying down and propping their knee up on pillows.\nAfter the acute phase, a person enters the recovery phase, which aims to correct the underlying issues of runner\u2019s knee.\nCombining knee and hip exercises to increase strength, mobility, and leg function is the most effective method. Other alternative treatments may offer relief."}, {"id": "54c7a4d3-15c2-4648-8d74-9362bd1528ae", "index": 34, "file_name": "runner_s_knee_pain_22.md", "category": "mobility", "topic": "Runner'S Knee Pain", "experience_level": "all", "distance_tier": "all", "source": "Medical News Today", "length": 1280, "text": "Combining knee and hip exercises to increase strength, mobility, and leg function is the most effective method. Other alternative treatments may offer relief. However, there is little research and evidence that they are effective, so most doctors and physical therapists do not recommend them.\nThey\ninclude\n:\nknee braces\nacupuncture\nmanipulation therapy\nelectrophysical therapies such as\nultrasound\nor\nTENS\nDoctors do not generally recommend referral to an orthopedic surgeon. They consider this a last resort after trying more conservative therapies.\nRecovery time\nThe recovery time for runner\u2019s knee varies depending on the individual, the severity of the injury, and how they follow their treatment plan. In most cases, people recover within\n8 weeks\n.\nAfter this time, if the pain has not improved, a doctor may order imaging tests to rule out\nosteoarthritis\n, patellar\nfractures\n, or other conditions.\nCauses\nRunner\u2019s knee occurs when the back of the kneecap contacts the thigh bone. Experts\nlink it to\n:\nOveruse:\nRepeated\nstress\non the knee, such as activities including running, football, and basketball, can cause injury.\nMuscle imbalance:\nWhen the muscles around the knee are not aligned, it can place extra stress on the kneecap, leading to injury.\nTrauma:\nA direct injur"}, {"id": "389d42e6-e52e-47bb-a5d3-e52f958d07c7", "index": 35, "file_name": "starting_a_running_routine_16.md", "category": "training", "topic": "Starting A Running Routine", "experience_level": "beginner", "distance_tier": "all", "source": "Healthline", "length": 1954, "text": "# The Best Way to Start a Running Routine\n\nThe best way to start a running routine is to keep it simple. Don\u2019t worry about following a complicated program.\nSo, you\u2019ve caught the running bug and want to get into a regular running routine. But where do you start, and how do you pace yourself?\nNot to worry. We\u2019ve got the tips, strategies, and training plans you need to get started and stay motivated. And if you think you\u2019re ready to tackle a 5K, we have training advice for that, too.\nWhat you need to get started\nRunning is simple, right? All you need is a pair of shoes, and out the door you go. Well, not so fast.\nYes, you do need a good pair of running shoes, but other\nessential items\ncan help make your training more successful and more enjoyable, too. And, let\u2019s face it, if you enjoy an activity, you\u2019re more likely to stick with it.\nInvest in a good pair of running shoes\nHitting the pavement requires\nmore than a pair\nof Vans or Converse. To reduce injuries and\nincrease comfort\n, you need shoes that are designed specifically for running.\nIdeally, you should get fitted for shoes at a running specialty store or with a podiatrist. If that\u2019s not possible,\ndo some research\nand look for a pair of running shoes that fits your needs.\nOpt for comfortable, sweat-wicking clothing\nWhen it comes to clothes, comfort is key. Stick with lightweight pants, shorts, and shirts\ndesigned for\nfitness activities.\nLook for sweat-wicking material and also consider the weather. Wearing layers in the winter helps keep you warm and allows you to remove clothing as necessary once you start warming up.\nCushioned\nrunning socks\nare also essential. Again, look for labels that say \u201csweat-wicking,\u201d and consider wool running socks in the winter. And finally, don\u2019t forget a supportive\nsports bra\n.\nUse technology to track your progress\nActivity and\nfitness trackers\nlike Fitbit, Garmin, and others can help keep you motivated and on track with your running goals."}, {"id": "2d17f3c6-5855-4f1e-a018-9646901904a6", "index": 36, "file_name": "starting_a_running_routine_16.md", "category": "training", "topic": "Starting A Running Routine", "experience_level": "beginner", "distance_tier": "all", "source": "Healthline", "length": 1868, "text": "And finally, don\u2019t forget a supportive\nsports bra\n.\nUse technology to track your progress\nActivity and\nfitness trackers\nlike Fitbit, Garmin, and others can help keep you motivated and on track with your running goals.\nMany of these wearable gadgets can keep track of:\nthe distance you\u2019ve run\nhow many steps you\u2019ve run\nhow many calories you\u2019ve burned\nyour running pace\nyour heart rate\nCreate a running playlist\nA great way to stay motivated is to listen to your\nfavorite tunes\nwhile running. Create a playlist with the music most likely to keep you moving.\nThat said, be sure to use\nyour headphones\nwisely. You may want to use just one earbud, which allows you to stay alert and aware of what\u2019s going on around you.\nA beginner\u2019s week-at-a-glance running routine\nYour initial goal is to build confidence and\nstamina\n. To do this, Steve Stonehouse, NASM CPT, USATF run coach and director of education for\nSTRIDE\n, suggests aiming for two to three runs each week at an easy to moderate pace.\n\u201cYou can always add techniques like speed work and\ntempo runs\nlater, but right now, it\u2019s just about getting your body used to the work,\u201d he said.\nFor example, a beginner\u2019s week-at-a-glance running routine might look like this:\nBeginner\u2019s training routine\nMonday:\nRun 2 miles at a moderate pace with a walk/run technique. For the first mile, run for 1 minute and walk for 1 minute. For the second mile, run for 90 seconds and walk for 1 minute.\nTuesday:\nFocus on full-body\nstrength training\n.\nWednesday:\nMake this an active rest day. Take a walk, or do some\nlight yoga\nand\nstretching\n.\nThursday:\nRun 2 miles at a moderate pace with a walk/run technique. Try to\nincrease your pace\nslightly from your previous run. For the first mile, run for 1 minute and walk for 1 minute. For the second mile, run for 90 seconds and walk for 1 minute.\nFriday:\nFocus on full-body strength training."}, {"id": "7e12b906-7d91-4071-a566-3fe8539325cf", "index": 37, "file_name": "starting_a_running_routine_16.md", "category": "training", "topic": "Starting A Running Routine", "experience_level": "beginner", "distance_tier": "all", "source": "Healthline", "length": 1606, "text": "For the first mile, run for 1 minute and walk for 1 minute. For the second mile, run for 90 seconds and walk for 1 minute.\nFriday:\nFocus on full-body strength training.\nSaturday:\nDo 30 to 60 minutes of cardio, such as\nwalking\n,\ncycling\n, or\nswimming\n.\nSunday:\nMake this an active rest day. Take a walk, or do some light yoga and stretching.\nAs you gain strength and stamina, you can gradually start increasing the distance you run, or you can add an extra day of running to your weekly routine. Decide what works\nbest for you\n, but do it slowly.\nHow to train for a 5K\nWhile it might be tempting to go all out, it\u2019s not the best way to get started.\n\u201cFollowing a structured training plan that increases your mileage over several weeks is essential for your health, safety, and motivation,\u201d Stonehouse said.\nThis advice is based on the fact that he\u2019s seen many first-timers crank out too many miles during the early days of their training.\n\u201cThose extra miles can take their toll, and I\u2019ve seen more new runners\ninjured in training\nthan in the race,\u201d he explained. To avoid this, Stonehouse suggests increasing your weekly mileage by 10% at a time, at the most.\n\u201cWhile this may not seem like much of a weekly increase, the No. 1 rule is to stay healthy, and being conservative usually helps you accomplish that,\u201d Stonehouse said.\nMany online\n5K training plans\nfor beginners use 4, 6, 8, and 10-week cycles.\nTo get started, you can follow the sample training plan outlined above, but add the following:\nWeeks 1\u20132:\nFollow the sample training plan outlined above.\nWeeks 3\u20134:\nSwap out the cardio day on Saturday fo"}, {"id": "be8dedf1-2785-4d60-b43c-167957a23c42", "index": 38, "file_name": "post_run_stretching_11.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 2017, "text": "# 10 Helpful Post-Run Stretches for Runners\n\nStretching is an essential part of almost every workout \u2014 especially running. Even going on a short jog works your muscles, and many doctors\nrecommend stretching\nboth before and after exercise.\nBecause\nexercise can shorten your muscles\n, skipping your post-activity stretch can decrease your mobility over time. Stretching keeps the muscles in the body flexible, so that they can stay at their fullest range of motion.\nMost doctors also recommend that you\nwarm up\nbefore stretching and running. Muscles respond better to the stress the body puts on them when they\u2019ve been warmed up.\nWarming up can be as simple as walking for 5 to 10 minutes, just enough to get the blood flowing through the body.\nStatic stretching vs. dynamic stretching\nStretching is typically divided into two different types:\nstatic\nand\ndynamic\n.\nStatic stretching\ninvolves moving a joint or muscle as far as you can and then holding it there for a period of time. For example:\nReaching down to touch your toes, and once you\u2019ve gone as far done as you can, holding that position for a set duration.\nDynamic stretching\ninvolves moving your joints or muscles in specific motions for a set amount of reps. For example:\nSwinging each of your legs back and forth 10 to 15 times before a run.\nThere\u2019s been a bit of back and forth in the fitness and research community regarding which type of stretching is better to do pre-workout. But the general consensus seems to be that dynamic stretching is most helpful pre-run, and static stretching is most helpful post-run.\n10 helpful post-run stretches\nBelow are 10 crucial muscle areas for runners, and some post-run stretches that help keep them healthy. If you\u2019re looking for a pre-workout stretching regime, we\u2019ve got a helpful one\nhere\n.\nNote: Because there are\nso\nmany\ndifferent kinds of static stretches out there, if one of these examples doesn\u2019t work for you, or if you\u2019ve found other\nstatic stretches\nthat provide better support, feel free to use those."}, {"id": "c3496fe9-ce3e-4875-8c69-1bab58424140", "index": 39, "file_name": "post_run_stretching_11.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 2028, "text": "Note: Because there are\nso\nmany\ndifferent kinds of static stretches out there, if one of these examples doesn\u2019t work for you, or if you\u2019ve found other\nstatic stretches\nthat provide better support, feel free to use those.\nQuadriceps\nShare on Pinterest\nOften referred to as your quads, your\nquadriceps femoris muscles\ncovers most of the front and sides of your thighs. Stretching your quadriceps is extra important if you\u2019re running up or down hills.\nTo stretch them:\nStand upright and pull your leg behind you with the corresponding hand.\nTuck your pelvis and pull your shin toward your thigh.\nKeep your knee pointing downward as you do this stretch to protect your knee joint.\nHold for at least 30 seconds, then switch sides.\nYou can also use a chair to balance yourself. This stretch should be felt in the front of your thigh, and from your hip down to your knee.\nHamstrings\nShare on Pinterest\nYour hamstrings make up the back part of your thigh, stretching from the hip to the knee. While this stretch predominantly helps with your hamstrings, it\u2019s also beneficial for your adductors.\nFor this stretch:\nSit on the ground and extend your left leg.\nMove your right foot toward your inner thigh, so that it touches the top part of your left leg, if possible.\nLean forward, bending but not rounding your back and waist toward the left foot as if reaching for your toes.\nHold for at least 30 seconds.\nRepeat with the other leg.\nYou should feel it in the back of your leg, from your knees to your buttocks.\nCalf\nShare on Pinterest\nYour calf muscles on the back of your lower legs are a key area to pay attention to after a run. Poor calf stretching can make\nsoreness and injury\nmore likely.\nTo stretch your calf muscles:\nStand with your right foot behind your left.\nBend your left leg forward while keeping your right leg straight.\nBe sure not to bend the right knee and to keep your right foot firmly on the ground, pointing straight ahead.\nStraighten your back and hold the pose for at least 30 seconds.\nRepeat with the other leg."}, {"id": "31629ec5-f94a-41c3-9a73-6d203565fd7d", "index": 40, "file_name": "post_run_stretching_11.md", "category": "mobility", "topic": "Post Run Stretching", "experience_level": "all", "distance_tier": "all", "source": "Healthline", "length": 1420, "text": "Be sure not to bend the right knee and to keep your right foot firmly on the ground, pointing straight ahead.\nStraighten your back and hold the pose for at least 30 seconds.\nRepeat with the other leg.\nFor a modification, or if you need help with balance, put your hands up against a wall and push into it.\nYou should feel this stretch anywhere from the back of your knee down to your ankle.\nIliotibial band\nShare on Pinterest\nWhile this stretch technically lengthens your\ntensor fascia latae\n(an important muscle in your hip), it\u2019s routinely called the\niliotibial (IT) band stretch\nbecause it can also help with your body\u2019s iliotibial band, which runs on the outside of your thigh between your hip and shin.\nRunners who don\u2019t quite have proper training techniques, and long-distance runners, can\ntypically injure this area\n.\nTo do this stretch:\nStand near a wall or something you can use to balance yourself.\nCross your left ankle behind your right ankle.\nWhile balancing with your right arm, stretch your left arm over your head.\nReach up and over with your torso and arm, stretching toward your right side.\nHold for at least 30 seconds and repeat with the other leg.\nWhen your left ankle is crossed behind your right ankle, and you\u2019re leaning toward the right, you\u2019ll feel the stretch in your left leg.\nPsoas\nShare on Pinterest\nThe\npsoas\n(pronounced \u201cso-az\u201d) muscle is on the front of your spine and connects the lower"}];
        let activeCategory = 'all';

        function renderChunks(filteredList) {
            const container = document.getElementById("chunksContainer");
            container.innerHTML = "";
            
            if (filteredList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No matching chunks found</h3>
                        <p>Try adjusting your search keywords or category filters.</p>
                    </div>
                `;
                return;
            }

            filteredList.forEach(chunk => {
                const card = document.createElement("div");
                card.className = "chunk-card";
                card.innerHTML = `
                    <div class="chunk-header">
                        <div class="chunk-title-group">
                            <span class="chunk-index">Chunk #${chunk.index} (ID: ${chunk.id.substring(0, 8)}...)</span>
                            <h3 class="chunk-topic">${chunk.topic}</h3>
                        </div>
                        <div class="badges-group">
                            <span class="badge badge-category">${chunk.category}</span>
                            <span class="badge badge-experience">${chunk.experience_level}</span>
                            <span class="badge badge-distance">${chunk.distance_tier}</span>
                        </div>
                    </div>
                    <div class="chunk-text">${escapeHtml(chunk.text)}</div>
                    <div class="chunk-footer">
                        <span>Source: <strong>${chunk.source}</strong> (${chunk.file_name})</span>
                        <span>Length: ${chunk.length} chars</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function setCategoryFilter(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            activeCategory = category;
            filterChunks();
        }

        function filterChunks() {
            const searchVal = document.getElementById("searchInput").value.toLowerCase();
            
            const filtered = chunks.filter(chunk => {
                const matchesCategory = activeCategory === 'all' || chunk.category === activeCategory;
                const matchesSearch = chunk.text.toLowerCase().includes(searchVal) || 
                                      chunk.topic.toLowerCase().includes(searchVal) ||
                                      chunk.file_name.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });
            
            renderChunks(filtered);
        }

        // Initial render
        renderChunks(chunks);
    </script>
